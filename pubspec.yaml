name: insighta
description: "Smart Farmer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any
  cupertino_icons: ^1.0.6
  get: ^4.6.5
  http: ^0.13.5
  video_player: ^2.5.2
  root_checker_plus: ^0.0.4
  percent_indicator: ^4.2.4
  device_info_plus: ^10.0.0
  firebase_core: ^2.17.0
  firebase_messaging: ^14.7.0
  permission_handler: ^12.0.0+1
  syncfusion_flutter_gauges: ^32.1.25
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  flutter_widget_from_html: ^0.15.0
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: insighta New design
      fonts:
        - asset: assets/fonts/insightaIcons.ttf
